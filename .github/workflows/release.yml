name: 发布候选版与正式版

on:
  workflow_dispatch:
    inputs:
      version:
        description: 要验证或发布的版本号（不含 v）
        required: true
        type: string
      publish:
        description: 准入通过后发布正式 Release
        required: true
        default: false
        type: boolean
      release_notes:
        description: update.json 中展示的版本说明
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: moonsea-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  web_gate:
    name: 官网质量门
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  windows_candidate:
    name: 构建 Windows 候选包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - name: 校验候选版本
        shell: pwsh
        run: |
          $packageVersion = [string](Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          if ($packageVersion -ne "${{ inputs.version }}") {
            throw "Input version ${{ inputs.version }} does not match package version $packageVersion"
          }
      - run: npm test
      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: 生成候选安装包
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $PWD ".build/windows-release"
          $setupPath = (& ./scripts/windows/Build-Moonsea-Setup.ps1 -OutputDirectory $releaseRoot | Select-Object -Last 1)
          $stage = Join-Path $releaseRoot "Moonsea-Codex-Windows-x64"
          ./tests/windows-updater-smoke.ps1 -PackageRoot $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$PWD/Moonsea-Codex-Windows-x64.zip"
          Copy-Item -LiteralPath $setupPath -Destination "$PWD/Moonsea-Codex-Windows-x64-Setup.exe"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-candidate
          retention-days: 14
          path: |
            Moonsea-Codex-Windows-x64.zip
            Moonsea-Codex-Windows-x64-Setup.exe

  macos_candidate:
    name: 构建 macOS 候选包
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 校验候选版本
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$package_version" = "${{ inputs.version }}"
      - run: npm test
      - name: 生成并验证 macOS 候选包
        run: |
          set -euo pipefail
          stage="$PWD/.build/Moonsea-Codex-macOS"
          tool_stage="$PWD/.build/macos-universal-tools"
          mkdir -p "$stage/tools" "$stage/scripts/macos" "$tool_stage"
          cp README.md LICENSE ASSET-LICENSE.md package.json Install.command Uninstall.command "$stage/"
          cp -R theme assets site admin "$stage/"
          cp scripts/macos/* "$stage/scripts/macos/"
          for target in bun-darwin-arm64 bun-darwin-x64; do
            arch="${target#bun-darwin-}"
            bun build ./src/build-static.mjs --compile --target="$target" --outfile "$tool_stage/moonsea-builder-$arch"
            bun build ./src/manager.mjs --compile --target="$target" --outfile "$tool_stage/moonsea-manager-$arch"
            codesign --remove-signature "$tool_stage/moonsea-builder-$arch" 2>/dev/null || true
            codesign --remove-signature "$tool_stage/moonsea-manager-$arch" 2>/dev/null || true
          done
          lipo -create "$tool_stage/moonsea-builder-arm64" "$tool_stage/moonsea-builder-x64" -output "$stage/tools/moonsea-builder"
          lipo -create "$tool_stage/moonsea-manager-arm64" "$tool_stage/moonsea-manager-x64" -output "$stage/tools/moonsea-manager"
          codesign --force --sign - "$stage/tools/moonsea-builder"
          codesign --force --sign - "$stage/tools/moonsea-manager"
          chmod +x "$stage"/*.command "$stage/tools/moonsea-builder" "$stage/tools/moonsea-manager" "$stage/scripts/macos"/*.sh "$stage/scripts/macos"/*.command
          MOONSEA_PROJECT_ROOT="$stage" "$stage/tools/moonsea-builder" --theme-version
          MOONSEA_TEST_PACKAGE_ROOT="$stage" \
            MOONSEA_TEST_BUILDER_PATH="$stage/tools/moonsea-builder" \
            zsh ./tests/macos-installer-smoke.sh
          MOONSEA_TEST_PACKAGE_ROOT="$stage" zsh ./tests/macos-updater-smoke.sh
          ditto -c -k --sequesterRsrc --keepParent "$stage" "$PWD/Moonsea-Codex-macOS.zip"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-candidate
          retention-days: 14
          path: Moonsea-Codex-macOS.zip

  windows_release_gate:
    name: Windows 真实软件内更新准入
    needs: windows_candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - uses: actions/download-artifact@v8.0.1
        with:
          name: windows-candidate
          path: .build/candidate
      - name: 下载上一稳定版安装包
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path .build/previous -Force | Out-Null
          gh release download --repo "$env:GITHUB_REPOSITORY" `
            --pattern "Moonsea-Codex-Windows-x64-Setup.exe" `
            --dir .build/previous
      - name: 执行真实软件内更新准入
        shell: powershell
        run: |
          ./tests/windows-release-gate.ps1 `
            -PreviousSetupPath "$PWD/.build/previous/Moonsea-Codex-Windows-x64-Setup.exe" `
            -CandidateSetupPath "$PWD/.build/candidate/Moonsea-Codex-Windows-x64-Setup.exe" `
            -CandidateVersion "${{ inputs.version }}" `
            -AllowSystemChanges
      - name: 保存准入证据
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-release-gate-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            .build/windows-release-gate/evidence.json
            .build/windows-release-gate/*.log
            .build/windows-release-gate/custom install/MoonseaCodex/updates/*.log

  publish:
    name: 发布已通过准入的同一批产物
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [web_gate, windows_candidate, macos_candidate, windows_release_gate]
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: 生成更新清单并发布
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          windows_file="artifacts/Moonsea-Codex-Windows-x64.zip"
          windows_installer="artifacts/Moonsea-Codex-Windows-x64-Setup.exe"
          macos_file="artifacts/Moonsea-Codex-macOS.zip"
          windows_sha="$(sha256sum "$windows_file" | cut -d' ' -f1)"
          windows_installer_sha="$(sha256sum "$windows_installer" | cut -d' ' -f1)"
          macos_sha="$(sha256sum "$macos_file" | cut -d' ' -f1)"
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "$RELEASE_NOTES" \
            --arg windowsUrl "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Moonsea-Codex-Windows-x64.zip" \
            --arg windowsSha "$windows_sha" \
            --argjson windowsSize "$(stat -c%s "$windows_file")" \
            --arg windowsInstallerUrl "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Moonsea-Codex-Windows-x64-Setup.exe" \
            --arg windowsInstallerSha "$windows_installer_sha" \
            --argjson windowsInstallerSize "$(stat -c%s "$windows_installer")" \
            --arg macosUrl "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Moonsea-Codex-macOS.zip" \
            --arg macosSha "$macos_sha" \
            --argjson macosSize "$(stat -c%s "$macos_file")" \
            '{
              schemaVersion: 1,
              version: $version,
              publishedAt: $publishedAt,
              notes: $notes,
              platforms: {
                windows: {
                  url: $windowsUrl,
                  sha256: $windowsSha,
                  size: $windowsSize,
                  installer: {
                    url: $windowsInstallerUrl,
                    sha256: $windowsInstallerSha,
                    size: $windowsInstallerSize
                  }
                },
                macos: { url: $macosUrl, sha256: $macosSha, size: $macosSize }
              }
            }' > artifacts/update.json
          gh release create "$tag" artifacts/*.zip artifacts/*.exe artifacts/update.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes

  post_release_probe:
    name: 正式版线上探针
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 校验更新清单、安装包与官网下载链路
        run: bash ./scripts/ci/probe-release.sh "${{ inputs.version }}"
